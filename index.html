<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diabetes Risk AI</title>
    <style>
        :root { --accent: #38bdf8; }
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); padding: 2rem; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        input { background: rgba(0,0,0,0.2); border: 1px solid #334155; padding: 12px; border-radius: 12px; color: white; width: 100%; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--accent); outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(90deg, #38bdf8, #818cf8); color: white; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3); }
        #output { margin-top: 20px; padding: 15px; border-radius: 16px; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>Diabetes Risk AI</h1>
    <p style="font-size: 0.9rem; opacity: 0.7;">Enter metrics for clinical analysis</p>
    <div class="grid">
        <input type="number" id="preg" placeholder="Pregnancies">
        <input type="number" id="glucose" placeholder="Glucose">
        <input type="number" id="bp" placeholder="BP">
        <input type="number" id="bmi" placeholder="BMI">
        <input type="number" id="age" placeholder="Age">
        <input type="number" id="dpf" placeholder="Pedigree" step="0.01">
    </div>
    <button onclick="analyze()">Analyze Health Profile</button>
    <div id="output"></div>
</div>

<script>
    function analyze() {
        const glucose = document.getElementById('glucose').value;
        const bmi = document.getElementById('bmi').value;
        const out = document.getElementById('output');
        
        // This is your "model" logic simplified for the browser
        const isHighRisk = (glucose > 130 || bmi > 30);
        
        out.style.display = 'block';
        out.style.background = isHighRisk ? 'rgba(244, 63, 94, 0.2)' : 'rgba(34, 197, 94, 0.2)';
        out.innerHTML = `<h3>${isHighRisk ? '⚠️ High Risk' : '✅ Low Risk'}</h3>
                         <p style="font-size: 0.85rem">${isHighRisk ? 'Please consult a healthcare professional.' : 'Your metrics appear within a healthy range.'}</p>`;
    }
</script>
</body>
</html>
