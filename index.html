<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Risk Assessment</title>
    <style>
        /* CSS combined here */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
        }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: white;
            width: 100%;
            box-sizing: border-box;
        }
        .glow-button {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: transform 0.2s;
        }
        .glow-button:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="glass-card">
        <header>
            <h1>Diabetes Risk AI</h1>
            <p>Predictive health assessment</p>
        </header>
        
        <form id="prediction-form">
            <div class="input-grid">
                <input type="number" id="preg" placeholder="Pregnancies" required>
                <input type="number" id="glucose" placeholder="Glucose" required>
                <input type="number" id="bp" placeholder="BP" required>
                <input type="number" id="bmi" placeholder="BMI" required>
            </div>
            <button type="submit" class="glow-button">Run Analysis</button>
        </form>

        <div id="result" style="margin-top: 20px; text-align: center;">
            <p id="prediction-output">Enter data to see results</p>
        </div>
    </div>

    <script>
        // JavaScript combined here
        document.getElementById('prediction-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const glucose = document.getElementById('glucose').value;
            const output = document.getElementById('prediction-output');
            
            // Placeholder logic: Since GitHub Pages is static, 
            // you cannot run the Python code here directly.
            if(glucose > 140) {
                output.innerHTML = "<strong>Result:</strong> High Risk Detected.";
            } else {
                output.innerHTML = "<strong>Result:</strong> Low Risk Detected.";
            }
        });
    </script>
</body>
</html>
